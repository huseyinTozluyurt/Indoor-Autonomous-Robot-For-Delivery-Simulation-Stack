/robot/controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

/robot/diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 0.436  # 2 x 0.218 (rb1_base.xacro wheel_offset_y)
    wheel_radius: 0.0762     # rubber_wheel_150.urdf.xacro

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link

    position_feedback: true
    enable_odom_tf: true

    cmd_vel_timeout: 0.5
    publish_limited_velocity: true

    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.8
    linear.x.min_velocity: -0.8
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 1.0
    linear.x.min_acceleration: -1.0

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.5
    angular.z.min_velocity: -1.5
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 2.0
    angular.z.min_acceleration: -2.0