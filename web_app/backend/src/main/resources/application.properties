spring.application.name=backend

# Local development database. Override with environment variables, e.g.
#   DB_URL=jdbc:mysql://host:3306/deliverybot_db DB_USERNAME=... DB_PASSWORD=... ./mvnw spring-boot:run
# The defaults match web_app/database/create_database.sql (local MySQL only; change them on any shared machine).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/deliverybot_db}
spring.datasource.username=${DB_USERNAME:deliverybot_user}
spring.datasource.password=${DB_PASSWORD:deliverybot123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
# Robot REST API: the Raspberry Pi on the real robot, or web_bridge (http://localhost:5000) in simulation.
# Can also be changed at runtime in the web app: Admin -> Robot Settings.
robot.pi.base-url=${ROBOT_BASE_URL:http://192.168.1.113:5000}

# Send every new order to the robot / Gazebo simulation at once
# (false = the admin sends it from View Orders)
robot.auto-dispatch=false

# Show error reasons (e.g. "robot is busy") in API error responses
server.error.include-message=always
